; Three logical databases point at the same PostgreSQL database. Each is its own
; pool, so a drill can choose whether the batch job and the reports share the
; API's connections ("lab") or get a small pool of their own (a bulkhead).
[databases]
lab        = host=pg-primary port=5432 dbname=lab pool_size=20
lab_batch  = host=pg-primary port=5432 dbname=lab pool_size=2
lab_report = host=pg-primary port=5432 dbname=lab pool_size=3

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; Lab only: trust inside the compose network, ports bound to localhost.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
max_prepared_statements = 200
; Clients wait this long for a server connection before PgBouncer errors.
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits,statement_timeout,lock_timeout
logfile =
pidfile =
