name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  smoke:
    # Bring the whole lab up with a small dataset and run one short drill,
    # so the compose file, SQL and driver script are tested too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start from no results (the repo keeps the recorded ones)
        run: rm -rf results
      - run: scripts/lab up
      - run: ACCOUNTS=2000 ORDERS=50000 scripts/lab seed
      - run: RATE=50 DURATION=20s BATCH_AT=5 scripts/lab run batch naive
      - run: RATE=50 DURATION=20s BATCH_AT=5 scripts/lab run batch chunked
      - name: every run wrote its results
        run: |
          for f in summary.json load.csv sampler.csv batch.json meta.json; do
            n=$(find results -name "$f" | wc -l)
            echo "$f: $n"
            test "$n" -eq 2
          done
          jq -e '.error == null' results/batch/*/*/batch.json
